name: registry-publish

# Publishes server.json to the MCP registry on its own, without touching npm.
#
# Recovery path. release.yml publishes to npm first (irreversible) and only then
# to the registry, because the registry verifies that the npm package carries our
# `mcpName`. If that last step fails, the npm version is already live but the
# registry entry is missing — and re-cutting the release cannot fix it, since npm
# rejects a duplicate version. Fix server.json on main, then dispatch this.
#
# No npm publish here, so it is safe to re-run.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref holding the server.json to publish (branch, tag, or SHA)'
        required: false
        default: main

permissions:
  contents: read
  id-token: write   # required for GitHub OIDC login to the registry

jobs:
  registry-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Fetch mcp-publisher (pinned by version + sha256)
        run: |
          set -euo pipefail
          PUBLISHER_VERSION=v1.7.9
          SHA256=ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          TARBALL=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$TARBALL" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json against the registry schema
        run: ./mcp-publisher validate

      - name: Show what will be published
        run: |
          node -p "'publishing ' + require('./server.json').name + ' v' + require('./server.json').version + ' -> npm ' + require('./server.json').packages[0].identifier + '@' + require('./server.json').packages[0].version"

      - name: Publish server.json to the MCP registry (GitHub OIDC)
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          # Same propagation race as release.yml: the registry refuses to register a
          # version it cannot yet see on npm, and npm's read path lags its own publish.
          # It bites here too, because this workflow is usually dispatched moments
          # after the release that failed — the gap has not closed yet. Re-running is
          # harmless (nothing here is irreversible), but waiting beats a red run, so
          # the budget is a deadline that tracks propagation rather than a try count.
          budget=600
          end=$(( $(date +%s) + budget ))
          delay=10
          until ./mcp-publisher publish; do
            if [ "$(date +%s)" -ge "$end" ]; then
              echo "::error::MCP registry publish still failing after $(( budget / 60 )) minutes."
              echo "::error::Nothing here is irreversible, so this workflow is safe to re-run."
              echo "::error::First confirm npm actually serves the version in server.json:"
              echo "::error::  npm view @saihm/mcp-server@<version> version"
              echo "::error::If npm does serve it, the failure is not propagation — read the"
              echo "::error::publisher output above before dispatching again."
              exit 1
            fi
            echo "registry publish failed (npm may still be propagating); retrying in ${delay}s..."
            sleep "$delay"
            delay=$(( delay * 2 )); if [ "$delay" -gt 60 ]; then delay=60; fi
          done
