name: release

# On a published GitHub Release this workflow:
#   1. Publishes the npm package @saihm/mcp-server with provenance via OIDC
#      trusted publishing. No npm token is used — authentication is OIDC, and npm
#      generates provenance attestations automatically under trusted publishing.
#   2. Publishes server.json to the MCP registry (registry.modelcontextprotocol.io)
#      via GitHub Actions OIDC. The io.github.SAIHM-Admin/* namespace is proven by
#      the workflow's OIDC claim (repo owner = SAIHM-Admin), so no token or one-time
#      registry registration is needed — only the id-token:write permission below.
#
# PREREQUISITE (one-time, on npmjs.com): register this repo+workflow as a
# Trusted Publisher for @saihm/mcp-server — package Settings -> Trusted Publisher:
#   Organization or user : SAIHM-Admin
#   Repository           : saihm-mcp
#   Workflow filename    : release.yml
#   Allowed actions      : npm publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # NOTE: deliberately NO registry-url — setup-node's registry-url writes an
      # .npmrc with a placeholder NODE_AUTH_TOKEN that shadows OIDC (npm then never
      # reaches trusted publishing). Omitting it leaves no auth line, so npm engages
      # OIDC on the default registry. access:public comes from package.json.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'            # >= 22.14.0 required for OIDC

      - name: Use npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Verify package + manifest versions match the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          SRVPKG="$(node -p "require('./server.json').packages[0].version")"
          echo "package.json=$PKG  server.json=$SRV  server.json.packages[0]=$SRVPKG  release-tag=$TAG"
          test "$PKG" = "$TAG"    || { echo "::error::package.json version mismatch ($PKG != $TAG)"; exit 1; }
          test "$SRV" = "$TAG"    || { echo "::error::server.json version mismatch ($SRV != $TAG)"; exit 1; }
          test "$SRVPKG" = "$TAG" || { echo "::error::server.json packages[0].version mismatch ($SRVPKG != $TAG)"; exit 1; }

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Fetch mcp-publisher and validate the manifest BEFORE the irreversible npm
      # publish. The sibling repo learned this the hard way at v0.2.0: a
      # schema-invalid server.json surfaced only after npm had already published,
      # leaving that version live but unlisted, which re-cutting the release cannot
      # repair (npm rejects a duplicate version). Validating first makes it a clean
      # pre-flight failure with npm untouched.
      - name: Fetch mcp-publisher (pinned by version + sha256)
        run: |
          set -euo pipefail
          PUBLISHER_VERSION=v1.7.9
          SHA256=ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          TARBALL=mcp-publisher_linux_amd64.tar.gz
          curl -fsSL -o "$TARBALL" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json against the registry schema
        run: ./mcp-publisher validate

      - name: Publish (OIDC trusted publishing — provenance is automatic)
        run: npm publish

      # Runs AFTER npm publish because the registry verifies that the npm package
      # carries our `mcpName`. Auth is GitHub Actions OIDC. If this step fails, the
      # npm version is ALREADY LIVE — do not re-cut the release. Fix server.json on
      # main and dispatch registry-publish.yml.
      - name: Publish server.json to the MCP registry (GitHub OIDC)
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          # The registry refuses to register a version it cannot yet see on npm, and
          # npm's read path lags its own publish. 0.3.11 sat in that gap longer than
          # the old 5-attempt/15s budget (75s total) and this step failed with the npm
          # version already live — which no re-run of this job can repair, because the
          # npm publish above is not idempotent. The budget is now a deadline rather
          # than an attempt count, so the wait tracks propagation instead of an
          # arbitrary number of tries, and it backs off instead of hammering.
          budget=600
          end=$(( $(date +%s) + budget ))
          delay=10
          until ./mcp-publisher publish; do
            if [ "$(date +%s)" -ge "$end" ]; then
              echo "::error::MCP registry publish still failing after $(( budget / 60 )) minutes."
              echo "::error::The npm version is ALREADY LIVE. Do NOT re-cut the release, and do"
              echo "::error::NOT 'gh run rerun --failed' — that re-runs the whole job including"
              echo "::error::the non-idempotent npm publish, which will refuse the version and"
              echo "::error::skip this step again. Recover with:"
              echo "::error::  gh workflow run registry-publish.yml -f ref=main"
              exit 1
            fi
            echo "registry publish failed (npm may still be propagating); retrying in ${delay}s..."
            sleep "$delay"
            delay=$(( delay * 2 )); if [ "$delay" -gt 60 ]; then delay=60; fi
          done
