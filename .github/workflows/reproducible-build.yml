name: reproducible-build

# Rebuilds a tagged release from source and compares the result with the
# tarball npm serves for that version. REPRODUCIBLE_BUILDS.md describes the
# same procedure for running by hand.
#
# Optional check: it publishes nothing and gates nothing. On a tag push it
# waits for npm to serve the new version, because release.yml publishes only
# after the GitHub Release is published and its own build and tests pass.
# Dispatch it by hand to check any earlier version.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to verify, without the leading v (for example 0.3.17)'
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="${INPUT_VERSION#v}"; else V="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$V' is not a version number"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: v${{ steps.v.outputs.version }}
          persist-credentials: false

      # Same Node.js major as release.yml. The 0.3.17 tarball rebuilds
      # byte-for-byte on Node 20, 22 and 24, so the exact minor is not critical.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install from the lockfile
        run: npm ci

      # The explicit build matches release.yml. Tags before v0.3.11 have no
      # prepack script, so `npm pack` alone would leave dist/ out.
      - name: Rebuild and pack
        run: |
          npm run build
          mkdir -p "$RUNNER_TEMP/rebuilt"
          npm pack --pack-destination "$RUNNER_TEMP/rebuilt"

      - name: Fetch the published tarball
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          budget=1800
          end=$(( $(date +%s) + budget ))
          until npm view "@saihm/mcp-server@${VERSION}" version >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$end" ]; then
              echo "::error::npm does not serve @saihm/mcp-server@${VERSION} after $(( budget / 60 )) minutes."
              echo "::error::Once the release is published, dispatch this workflow with version=${VERSION}."
              exit 1
            fi
            echo "npm does not serve ${VERSION} yet; retrying in 30s..."
            sleep 30
          done
          GH="$(npm view "@saihm/mcp-server@${VERSION}" gitHead)"
          echo "npm gitHead: $GH"
          echo "tag commit:  $(git rev-parse HEAD)"
          test "$GH" = "$(git rev-parse HEAD)" || { echo "::error::npm gitHead $GH is not the tag commit"; exit 1; }
          mkdir -p "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          npm pack "@saihm/mcp-server@${VERSION}"

      - name: Compare
        run: |
          set -euo pipefail
          R="$(ls "$RUNNER_TEMP"/rebuilt/*.tgz)"
          P="$(ls "$RUNNER_TEMP"/published/*.tgz)"
          sha256sum "$R" "$P"
          mkdir -p "$RUNNER_TEMP/x/rebuilt" "$RUNNER_TEMP/x/published"
          tar -xzf "$R" -C "$RUNNER_TEMP/x/rebuilt"
          tar -xzf "$P" -C "$RUNNER_TEMP/x/published"
          # File contents: dist/ plus every other file in the package.
          diff -r "$RUNNER_TEMP/x/rebuilt/package" "$RUNNER_TEMP/x/published/package"
          # Archive entries: mode, size, timestamp and name, in order.
          listing() { tar -tvzf "$1" | awk '{print $1, $3, $4, $5, $6}'; }
          diff <(listing "$R") <(listing "$P")
          if cmp -s "$R" "$P"; then
            echo "The rebuilt tarball is byte-identical to the published one."
          else
            echo "::notice::Contents and entries match; the compressed bytes differ."
          fi
