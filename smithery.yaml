# Smithery configuration for @saihm/mcp-server
# Standards client for custodial SAIHM operators (endpoint URL + operator token). Free start: @saihm/mcp-server-pro.
# https://smithery.ai

startCommand:
  type: stdio
  configSchema:
    type: object
    # Both values below are needed to use the server. They stay optional here so Smithery's
    # tool scanner can start the server and list its eight tools: boot is lazy, and a missing
    # endpoint surfaces as a typed error on the first call.
    required: []
    properties:
      saihmEndpointUrl:
        type: string
        description: >-
          Endpoint URL of the custodial SAIHM operator you run. For the
          hosted service at https://saihm.net, use @saihm/mcp-server-pro.
      saihmAuthHeader:
        type: string
        description: Authorization header (typically 'Bearer <token>') issued by your operator.
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@saihm/mcp-server'],
      env: {
        SAIHM_ENDPOINT_URL: config.saihmEndpointUrl,
        SAIHM_AUTH_HEADER: config.saihmAuthHeader,
      },
    })
